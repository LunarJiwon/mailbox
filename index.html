<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>너에게 온 편지 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<style>
  :root { --bg1: #ffeef3; --bg2: #ffd6e2; --box: #ff6f91; --box-dark: #e0517a; --ink: #6b3a4b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
    font-family: 'Jua', sans-serif; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  #app { position: relative; display: flex; flex-direction: column; align-items: center; }

  .hint { margin-bottom: 28px; font-size: 22px; height: 30px; text-align: center; transition: opacity .4s; }

  .scene { position: relative; width: 220px; height: 360px; perspective: 700px; cursor: pointer; }

  /* 기둥 */
  .post { position: absolute; left: 50%; bottom: 0; width: 26px; height: 150px; margin-left: -13px;
          background: #b07a5a; border-radius: 4px; }

  /* 우편함 몸통 */
  .box { position: absolute; left: 0; bottom: 140px; width: 220px; height: 190px;
         background: var(--box); border-radius: 110px 110px 14px 14px;
         box-shadow: inset -14px -10px 0 var(--box-dark), 0 14px 30px rgba(224, 81, 122, .25); }
  .inside { position: absolute; left: 22px; right: 22px; top: 22px; bottom: 16px;
            background: #5a2638; border-radius: 88px 88px 8px 8px; }

  /* 문 (아래쪽 경첩) */
  .door { position: absolute; left: 22px; right: 22px; top: 22px; bottom: 16px;
          background: #ff8fab; border-radius: 88px 88px 8px 8px;
          transform-origin: 50% 100%; transition: transform .9s cubic-bezier(.3, 1.4, .5, 1);
          display: flex; align-items: center; justify-content: center;
          box-shadow: inset 0 -8px 0 rgba(0,0,0,.06); z-index: 3; }
  .door .knob { position: absolute; top: 20px; width: 34px; height: 10px; border-radius: 6px; background: #fff3; }
  .door .label, .door .knob { transition: opacity .2s .25s; }
  .open .door .label, .open .door .knob { opacity: 0; }
  .door .label { color: #fff; font-size: 22px; letter-spacing: 2px; }
  .open .door { transform: rotateX(-115deg); }

  /* 깃발 */
  .flag { position: absolute; right: -2px; bottom: 200px; width: 10px; height: 80px; background: #ffd166;
          border-radius: 4px; transform-origin: 50% 100%; transform: rotate(90deg); transition: transform .6s .2s; z-index: 4; }
  .flag::after { content: ''; position: absolute; top: 0; left: 8px; width: 34px; height: 24px;
                 background: #ffd166; border-radius: 0 6px 6px 0; }
  .open .flag { transform: rotate(0deg); }

  /* 하트 */
  .heart { position: absolute; left: 50%; bottom: 175px; width: 120px; margin-left: -60px; z-index: 2;
           transform: translateY(30px) scale(.3); opacity: 0;
           transition: transform 1s cubic-bezier(.2, 1.6, .4, 1) .45s, opacity .3s .45s;
           filter: drop-shadow(0 10px 18px rgba(240, 40, 90, .35)); pointer-events: none; }
  .open .heart { transform: translateY(-150px) scale(1); opacity: 1; z-index: 5; }
  .open .heart svg { animation: beat 1.1s ease-in-out 1.5s infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(.98); } 45% { transform: scale(1.08); } }

  .message { margin-top: 26px; font-size: 30px; color: #e0517a; height: 40px;
             opacity: 0; transform: translateY(8px); transition: all .6s 1.2s; }
  .scene.open ~ .message { opacity: 1; transform: none; }

  .spark { position: fixed; pointer-events: none; font-size: 22px; z-index: 10;
           animation: fly 1.6s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.6); opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <div class="hint" :style="{ opacity: open ? 0 : 1 }">💌 편지가 도착했어요! 우편함을 열어봐</div>

  <div class="scene" :class="{ open }" @click="toggle" ref="scene">
    <div class="post"></div>
    <div class="box">
      <div class="inside"></div>
      <div class="door"><div class="knob"></div><div class="label">MAIL</div></div>
    </div>
    <div class="flag"></div>
    <div class="heart">
      <svg viewBox="0 0 32 29" width="120">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff4d7d" /><stop offset="1" stop-color="#e01e5a" />
          </linearGradient>
        </defs>
        <path fill="url(#g)" d="M16 28.5 C 6 21 0 15.5 0 9 C 0 4 4 0 8.5 0 C 11.6 0 14.3 1.8 16 4.5 C 17.7 1.8 20.4 0 23.5 0 C 28 0 32 4 32 9 C 32 15.5 26 21 16 28.5 Z" />
        <ellipse cx="9" cy="8" rx="3.5" ry="2.2" fill="#fff" opacity=".45" transform="rotate(-30 9 8)" />
      </svg>
    </div>
  </div>

  <div class="message">좋아해 💗</div>

  <span v-for="s in sparks" :key="s.id" class="spark"
        :style="{ left: s.x + 'px', top: s.y + 'px', '--dx': s.dx + 'px', '--dy': s.dy + 'px', '--r': s.r + 'deg' }">{{ s.e }}</span>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
  setup() {
    const open = ref(false);
    const scene = ref(null);
    const sparks = ref([]);
    let id = 0;

    function burst() {
      const rect = scene.value.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + 40;
      const icons = ['💗', '💕', '💖', '✨', '🌸'];
      const batch = Array.from({ length: 18 }, (_, i) => {
        const a = (i / 18) * Math.PI * 2;
        const dist = 120 + Math.random() * 90;
        return { id: ++id, x: cx - 11, y: cy, dx: Math.cos(a) * dist, dy: Math.sin(a) * dist - 40,
                 r: Math.random() * 120 - 60, e: icons[i % icons.length] };
      });
      sparks.value.push(...batch);
      setTimeout(() => {
        const ids = new Set(batch.map(b => b.id));
        sparks.value = sparks.value.filter(s => !ids.has(s.id));
      }, 1800);
    }

    function toggle() {
      open.value = !open.value;
      if (open.value) setTimeout(burst, 1000);
    }

    return { open, scene, sparks, toggle };
  },
}).mount('#app');
</script>
</body>
</html>
